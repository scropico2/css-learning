<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cascade + Box Model</title>
    <link rel="stylesheet" href="boxmodelcascade.css">
</head>
<body>
    <div class="card">
        <p class="highlight">I'm a highlighted note inside a card.</p>
        <p>I'm a normal paragraph inside the same card.</p>
    </div>

    <div class="card special">
        <p class="highlight">I'm highlighted, but my card is special.</p>
        <p id="unique-note">I have a unique id, not just a class.</p>
    </div>
</body>
</html>
