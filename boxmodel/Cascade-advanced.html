<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Cascade + Box Model</title>
    <link rel="stylesheet" href="Cascade-advanced.css">
</head>
<body>
    <div class="panel">
        <h2 class="title" style="color:green">Panel One</h2>
        <p class="text warning">This paragraph has two classes.</p>
    </div>

    <div class="panel">
        <h2 class="title" style="color: green;">Panel Two</h2>
        <p class="text warning" id="critical">This one also has an id.</p>
    </div>

    <div class="panel">
        <h2 class="title" style="color: purple;">Panel Three (inline style)</h2>
        <p class="text">Plain text paragraph, no warning class.</p>
    </div>

    <div class="fine">
        <h3 class="title">Auskarai</h3>
        <p class="text" style="color: brown;">Plain text aswell</p>
    </div>
</body>
</html>
