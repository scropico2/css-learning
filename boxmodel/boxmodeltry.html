<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Practice</title>
    <link rel="stylesheet" href="boxmodeltry.css">
</head>
<body>

    <p class="box-a">This is paragraph A. I should have padding inside me, pushing my text away from my border.</p>
    <p class="box-b">This is paragraph B. I should have a margin around me, pushing other boxes away from me.</p>
    <p class="box-c">This is paragraph C. I should have both padding AND a thick border.</p>
    
</body>
